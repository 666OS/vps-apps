x-vps:
  name: Magpie
  tag: AI 网关
  desc: 统一多模型 API 网关与编码 Agent 管理面板 (建议反代 HTTPS)
  url: https://usemagpie.ai/docs/docker
  port: 3430
  auth: 访问 /?k=<密钥> (自动生成并保存于 .env)

services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: magpie
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3430}:3430"
    environment:
      - MAGPIE_DRAIN=20
      - MAGPIE_WEB_KEY=${APP_PASSWORD}
    volumes:
      - ./data:/config
    command: [web, --addr, 0.0.0.0:3430, --no-open]
