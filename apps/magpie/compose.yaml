services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: magpie
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-3430}:3430"
    environment:
      - MAGPIE_DRAIN=20
    volumes:
      - ./data:/config
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /config/home /config/cache /config/data /config/state
        if [ -z "$${MAGPIE_WEB_KEY:-}" ]; then
          if [ ! -s /config/.web_key ]; then
            od -An -tx1 -N16 /dev/urandom | tr -d ' \n' > /config/.web_key
            chmod 600 /config/.web_key
          fi
          export MAGPIE_WEB_KEY="$$(cat /config/.web_key)"
        fi
        exec /magpie web --addr 0.0.0.0:3430 --no-open
