x-vps:
  name: Uptime Kuma
  tag: 运维监控
  desc: 开箱即用的服务监控与状态页
  url: https://uptime.kuma.pet
  port: 3001
  auth: 首位访问者直接注册管理员

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-3001}:3001"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

